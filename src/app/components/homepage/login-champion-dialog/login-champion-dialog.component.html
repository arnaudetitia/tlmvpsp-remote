<h2 mat-dialog-title>Se connecter en tant que champion</h2>

<mat-dialog-content>
  <div class="login-champion-container">
    <div class="champ">Donner le code de la partie :</div>
    <input class="champ code-champion" [(ngModel)]="appCodeChampion" />
    <button class="btn btn-primary champ" (click)="connectChampion()">
      Accéder aux questions super-cash
    </button>
    @if (error()) {
      <div class="champ erreur">{{ error() }}</div>
    }
  </div>
</mat-dialog-content>

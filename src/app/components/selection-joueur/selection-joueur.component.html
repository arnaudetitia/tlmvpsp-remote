<div class="selection-joueur-container">
  @if (joueursCompet$ | async; as joueursCompet) {
    <div class="joueurs-compet-list">
      @for (joueur of joueursCompet; track joueur) {
        <div
          class="choix-joueur champ"
          [class.connected]="joueur.connected"
          (click)="connectJoueur(joueur)"
          >
          {{ joueur.nomJoueur }}
        </div>
      }
    </div>
  }
</div>
